<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Paper Reader — 独立预览工作台</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      --dsw-alias-bg-base: #ffffff;
      --dsw-alias-bg-layer-1: #f8fafc;
      --dsw-alias-bg-layer-2: #f1f5f9;
      --dsw-alias-label-primary: #0f172a;
      --dsw-alias-label-secondary: #64748b;
      --dsw-alias-label-tertiary: #94a3b8;
      --dsw-alias-border-l1: #e2e8f0;
      --dsw-alias-border-l2: #cbd5e1;
      --dsw-alias-border-l3: #94a3b8;
      --dsw-alias-brand-primary: #0284c7;
      --dsw-alias-brand-hover: #0369a1;
      --dsw-alias-interactive-bg-hover: #f1f5f9;
      --dsw-alias-state-success-primary: #10b981;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --dsw-alias-bg-base: #0f172a;
        --dsw-alias-bg-layer-1: #1e293b;
        --dsw-alias-bg-layer-2: #334155;
        --dsw-alias-label-primary: #f8fafc;
        --dsw-alias-label-secondary: #94a3b8;
        --dsw-alias-label-tertiary: #64748b;
        --dsw-alias-border-l1: #334155;
        --dsw-alias-border-l2: #475569;
        --dsw-alias-border-l3: #64748b;
        --dsw-alias-brand-primary: #38bdf8;
        --dsw-alias-brand-hover: #7dd3fc;
        --dsw-alias-interactive-bg-hover: #334155;
        --dsw-alias-state-success-primary: #34d399;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
  <script src="/vendor/react.development.js"></script>
  <script src="/vendor/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    (function() {
      let registeredComponent = null;
      let registeredInject = null;
      const dictionaries = {};

      window.__ModuleLoader__ = {
        load: function(manifest) {
          const factory = manifest.factory;
          const plugin = factory(function(mod) {
            if (mod === 'react') return window.React;
            throw new Error('Unknown module: ' + mod);
          });

          const mockCtx = {
            effect: (fn) => fn(),
            locale: {
              register: (ns, dicts) => { dictionaries[ns] = dicts; },
              bind: (ns) => (key) => dictionaries[ns]?.zh?.[key] ?? key,
            },
            slots: {
              inject: (slot, fn) => {
                fn();
              },
              register: (opts, Component) => {
                if (opts.name === 'main' && opts.key === 'paper-reader') {
                  registeredComponent = Component;
                  registeredInject = opts.inject;
                }
              }
            },
            sessions: {
              list: {
                subscribe: (fn) => () => {},
                getSnapshot: () => ({ phase: 'ready', byId: {} })
              },
              create: async () => 'mock-session-001',
              using: async () => ({ ok: true })
            },
            workspaces: {
              create: async ({ path }) => ({ workspaceId: 'mock-ws-001' }),
              list: { getSnapshot: () => ({ archivedSessionIds: [] }) }
            },
            uiWorkspace: {
              openSession: (id) => console.log('[UI Workspace] openSession:', id)
            },
            layout: {
              selectPanel: (p) => console.log('[UI Layout] selectPanel:', p)
            },
            remote: {
              session: {
                modelCatalog: async () => ({
                  ok: true,
                  value: [
                    { provider: 'anthropic', model: 'claude-3-7-sonnet-20250219', name: 'Claude 3.7 Sonnet' },
                    { provider: 'google', model: 'gemini-2.5-pro', name: 'Gemini 2.5 Pro' },
                    { provider: 'openai', model: 'gpt-4o', name: 'GPT-4o' }
                  ]
                }),
                create: async () => ({ ok: true, value: { sessionId: 'session-' + Date.now() } }),
                rename: async () => ({ ok: true }),
                selectModel: async ({ provider, model }) => ({ ok: true, value: { selected: { provider, model } } })
              }
            }
          };

          plugin.apply(mockCtx);

          if (registeredComponent) {
            const face = registeredInject ? registeredInject() : {};
            const rootEl = document.getElementById('root');
            const root = ReactDOM.createRoot(rootEl);
            root.render(React.createElement(registeredComponent, {
              t: (k) => dictionaries['paper-reader']?.zh?.[k] ?? k,
              ...face,
              onClose: () => {
                console.log('Close reader requested');
              }
            }));
          } else {
            document.getElementById('root').innerHTML = '<div style="padding:40px;color:red;">Error: ReaderPage failed to register.</div>';
          }
        }
      };
    })();
  </script>
  <script src="/client.js"></script>
</body>
</html>
