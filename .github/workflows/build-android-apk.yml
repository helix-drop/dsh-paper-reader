name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor & generate Android project
        working-directory: mobile-app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npm install
          npx cap add android
          cp native-android/ReaderNativePlugin.java android/app/src/main/java/com/dsh/paperreader/
          cp native-android/MainActivity.java android/app/src/main/java/com/dsh/paperreader/
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/dsh-release.p12
          fi
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const runNum = Math.max(2, Number(process.env.GITHUB_RUN_NUMBER || 2));
            const verName = `${pkg.version}.${runNum}`;

            const xmlFile = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(xmlFile, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }
            if (!xml.includes("android.permission.POST_NOTIFICATIONS")) {
              xml = xml.replace(
                /<manifest\b([^>]*)>/,
                "<manifest$1>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
              );
            }
            fs.writeFileSync(xmlFile, xml);

            const gradleFile = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradleFile, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${runNum}`);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${verName}"`);
            if (fs.existsSync("android/app/dsh-release.p12") && process.env.KEYSTORE_PASS) {
              const signingBlock = [
                "    signingConfigs {",
                "        release {",
                "            storeFile file(\"dsh-release.p12\")",
                "            storePassword System.getenv(\"KEYSTORE_PASS\")",
                "            keyAlias System.getenv(\"KEY_ALIAS\") ?: \"dsh-paper-reader\"",
                "            keyPassword System.getenv(\"KEYSTORE_PASS\")",
                "            v1SigningEnabled true",
                "            v2SigningEnabled true",
                "        }",
                "    }",
              ].join("\n");
              gradle = gradle.replace(
                /buildTypes\s*\{\s*release\s*\{/,
                `${signingBlock}\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }\n        release {\n            signingConfig signingConfigs.release`
              );
            }
            fs.writeFileSync(gradleFile, gradle);

            const appJsFile = "www/js/app.js";
            let appJs = fs.readFileSync(appJsFile, "utf8");
            appJs = appJs.replace(/const APP_VERSION = \x27[^\x27]*\x27/, `const APP_VERSION = \x27${verName}\x27`);
            fs.writeFileSync(appJsFile, appJs);
          '
          node scripts/fetch-fonts.mjs
          npx cap sync android

      - name: Build Signed Release APK
        working-directory: mobile-app/android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease
          mkdir -p app/build/outputs/apk/signed
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/signed/DSH-Paper-Reader-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/signed/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Paper-Reader-APK
          path: mobile-app/android/app/build/outputs/apk/signed/*.apk
